apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  ignoreDifferences:
    - group: argoproj.io
      kind: ApplicationSet
      name: perceptiq-preview
      jqPathExpressions:
        - .metadata.annotations["argocd.argoproj.io/tracking-id"]
    - group: argoproj.io
      kind: ApplicationSet
      name: perceptiq-preview
      jsonPointers:
        - /spec/goTemplatePatch
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: layer0/apps-of-apps
    repoURL: https://github.com/s1monb/homelab.git
    targetRevision: main
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true