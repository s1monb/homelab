# Provisioned into Grafana by the dashboard sidecar (label grafana_dashboard=1),
# so this dashboard is version-controlled rather than clicked together in the UI.
#
# Every query here runs against a metric verified to exist on the live cluster.
# Pod CPU/memory panels are deliberately absent: the kubeletstats receiver has
# been failing TLS against the Talos kubelet since it was deployed, so the
# k8s_pod_* family has never reached Mimir. The otel-collector Application now
# fixes that, and those panels can be added once the names are confirmed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-perceptiq
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PerceptIQ
data:
  perceptiq-platform.json: |
    {
      "uid": "perceptiq-platform",
      "title": "PerceptIQ Platform",
      "tags": [
        "perceptiq",
        "platform"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "editable": false,
      "panels": [
        {
          "type": "row",
          "title": "Service health",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "API replicas available",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"perceptiq\", deployment=\"perceptiq\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Postgres",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 5,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cnpg_collector_up{namespace=\"perceptiq\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Ingress requests/s",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 9,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=\"kube-system/cilium-ingress/perceptiq_perceptiq_80\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Ingress 5xx",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 14,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=\"kube-system/cilium-ingress/perceptiq_perceptiq_80\", envoy_response_code_class=\"5\"}[5m])) / sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=\"kube-system/cilium-ingress/perceptiq_perceptiq_80\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "JetStream storage used",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 19,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nats_varz_jetstream_stats_storage / nats_varz_jetstream_config_max_storage",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.75
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Edge (Cilium Envoy)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Requests/s by status class",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (envoy_response_code_class) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=\"kube-system/cilium-ingress/perceptiq_perceptiq_80\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "legendFormat": "{{envoy_response_code_class}}xx",
              "instant": false,
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "description": "Measured at Cilium's Envoy, so this is what users actually receive. Needs no application instrumentation."
        },
        {
          "type": "timeseries",
          "title": "Ingress latency",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=\"kube-system/cilium-ingress/perceptiq_perceptiq_80\"}[5m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "legendFormat": "p95",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=\"kube-system/cilium-ingress/perceptiq_perceptiq_80\"}[5m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "legendFormat": "p50",
              "instant": false,
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Review pipeline (NATS JetStream)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Pending messages by consumer",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (consumer_name, stream_name) (nats_consumer_num_pending)",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "legendFormat": "{{stream_name}} / {{consumer_name}}",
              "instant": false,
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "description": "A burst is normal right after a scrape: one sync can upsert up to APIFY_MAX_REVIEWS reviews, each fanning out to the sentiment and theme workers. What matters is that it drains."
        },
        {
          "type": "timeseries",
          "title": "Time since last ack",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (consumer_name, stream_name) (nats_consumer_last_ack_seconds)",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "legendFormat": "{{stream_name}} / {{consumer_name}}",
              "instant": false,
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "description": "Grows harmlessly while the system is idle. It only means trouble alongside pending > 0, which is how the stalled-consumer alert is written."
        },
        {
          "type": "timeseries",
          "title": "Redelivered messages",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (consumer_name, stream_name) (nats_consumer_num_redelivered)",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "legendFormat": "{{stream_name}} / {{consumer_name}}",
              "instant": false,
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "description": "Handlers nak on failure and the message is terminated after max_deliver. There is no dead-letter stream, so redelivery is the last warning before work is silently lost."
        },
        {
          "type": "row",
          "title": "Database (CloudNativePG)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Backends",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (cnpg_cluster) (cnpg_backends_total{namespace=\"perceptiq\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "legendFormat": "{{cnpg_cluster}}",
              "instant": false,
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "WAL bytes/s",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "PAE45454D0EDB9216"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (cnpg_cluster) (rate(cnpg_collector_wal_bytes{namespace=\"perceptiq\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "PAE45454D0EDB9216"
              },
              "editorMode": "code",
              "legendFormat": "{{cnpg_cluster}}",
              "instant": false,
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Errors",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 29
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "logs",
          "title": "PerceptIQ errors and worker failures",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "description": "Scrape failures are deliberately absent here: every _mark_failed path in the scraper worker writes LocationSource.lastSyncStatus and logs nothing, so a failed Apify run produces no log line at all. Surfacing it needs an application change.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "editorMode": "code",
              "queryType": "range",
              "expr": "{k8s_namespace_name=\"perceptiq\"} |~ `ERROR|handler failed|poison message`"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        }
      ]
    }
