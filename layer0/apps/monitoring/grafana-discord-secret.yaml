# Webhook URL for the Grafana alerting contact point. Grafana reads it from the
# DISCORD_ALERT_WEBHOOK_URL env var (wired in the grafana Application) and
# interpolates it into the provisioned contact point at load time, so the URL
# itself never lands in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-discord
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-discord
  data:
    - secretKey: webhook-url
      remoteRef:
        key: grafana
        property: discord_webhook_url
