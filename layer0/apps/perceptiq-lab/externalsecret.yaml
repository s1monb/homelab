apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: perceptiq-lab-secrets
  namespace: perceptiq-lab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: perceptiq-lab-secrets
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: perceptiq-lab
        property: OPENAI_API_KEY
    - secretKey: APIFY_TOKEN
      remoteRef:
        key: perceptiq-lab
        property: APIFY_TOKEN
    - secretKey: APP_PASSWORD
      remoteRef:
        key: perceptiq-lab
        property: APP_PASSWORD
    - secretKey: SESSION_SECRET
      remoteRef:
        key: perceptiq-lab
        property: SESSION_SECRET
