apiVersion: v1
kind: ConfigMap
metadata:
  name: perceptiq
  namespace: perceptiq
data:
  APIFY_ACTOR_ID: "compass~google-maps-reviews-scraper"
  APIFY_ACTOR_ID_APIFY_FACEBOOK: "apify~facebook-reviews-scraper"
  APIFY_ACTOR_ID_APIFY_TRUSTPILOT: "memo23~trustpilot-scraper-ppe"
  APIFY_MAX_REVIEWS: "1000"
  APIFY_SYNC_TIMEOUT_MINUTES: "20"
  CLERK_ISSUER: "https://enhanced-raven-64.clerk.accounts.dev"
  CLERK_JWKS_URL: "https://enhanced-raven-64.clerk.accounts.dev/.well-known/jwks.json"
  VITE_CLERK_PUBLISHABLE_KEY: "pk_test_ZW5oYW5jZWQtcmF2ZW4tNjQuY2xlcmsuYWNjb3VudHMuZGV2JA"
  # Absolute base for URLs we hand to third parties — notably Stripe checkout
  # and billing-portal redirects. Without it those fall back to localhost, which
  # sends a production user to their own machine after paying.
  FRONTEND_URL: "https://perceptiq.no"
  GOOGLE_APPLICATION_CREDENTIALS: "/etc/gcp/sa-key.json"
  GOOGLE_CLOUD_PROJECT: "perceptiq"
  # Worker fleet: each step is handled by its standalone worker instead of
  # in-process. Keep in lockstep with the worker Deployments in workers.yaml.
  FLEET_SENTIMENT_ENABLED: "true"
  FLEET_THEME_ENABLED: "true"
  FLEET_SCRAPER_ENABLED: "true"

  # Scheduled review syncing. Paid locations refresh daily, free weekly; every
  # Apify run is billed whether or not anything is new, so there is no
  # user-facing "sync now". Both API replicas tick, but due locations are
  # claimed atomically in one UPDATE, so a scrape can never be started twice.
  SYNC_SCHEDULER_ENABLED: "true"
  SYNC_INTERVAL_HOURS_PAID: "24"
  SYNC_INTERVAL_HOURS_FREE: "168"
  # Review budget for a paid location. Must stay above the free plan's 100,
  # which is hardcoded in the API — reusing APIFY_MAX_REVIEWS for this once made
  # upgrading fetch *fewer* reviews than the free plan.
  APIFY_MAX_REVIEWS_PAID: "1000"
