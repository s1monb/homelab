apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: perceptiq-secrets
  namespace: perceptiq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: perceptiq-secrets
    # Compose NATS_URL (with credentials) from the cluster NATS auth so the API
    # connects to JetStream in the messaging namespace. Merged with the fetched
    # keys below.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        NATS_URL: "nats://{{ .natsUser }}:{{ .natsPassword }}@nats.messaging.svc.cluster.local:4222"
  data:
    - secretKey: GOOGLE_PLACES_API_KEY
      remoteRef:
        key: perceptiq
        property: GOOGLE_PLACES_API_KEY
    - secretKey: APIFY_TOKEN
      remoteRef:
        key: perceptiq
        property: APIFY_TOKEN
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: perceptiq
        property: OPENAI_API_KEY
    # Billing. STRIPE_PRICE_LOCATION is not itself a secret, but it lives here
    # so the key and the price it refers to are rotated together — they are
    # per-account and per-mode, so a live key with a test price silently fails.
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: perceptiq
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_PRICE_LOCATION
      remoteRef:
        key: perceptiq
        property: STRIPE_PRICE_LOCATION
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: perceptiq
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: natsUser
      remoteRef:
        key: nats
        property: username
    - secretKey: natsPassword
      remoteRef:
        key: nats
        property: password